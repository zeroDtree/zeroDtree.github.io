name: Deploy Quartz site to GitHub Pages
 
on:
  push:
    branches:
      - v5
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: "pages"
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-
      - name: Install Dependencies
        run: npm ci
      - name: Install Quartz plugins
        run: |
          python3 - <<'PY'
          import json, os, shutil, subprocess
          root = ".quartz/plugins"
          lock = json.load(open("quartz.lock.json"))["plugins"]
          for name, entry in lock.items():
              plugin = os.path.join(root, name)
              if entry.get("commit") == "local" or not os.path.isdir(os.path.join(plugin, ".git")):
                  continue
              url = subprocess.check_output(
                  ["git", "remote", "get-url", "origin"], cwd=plugin, text=True
              ).strip()
              resolved = entry["resolved"].rstrip("/")
              if url.rstrip("/") != resolved:
                  print(f"removing {name}: cached origin {url} != {resolved}")
                  shutil.rmtree(plugin)
          PY
          npx quartz plugin install
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
 
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4